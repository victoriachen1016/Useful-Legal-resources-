<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Law Friend Online 提供免費法律相關模板，希望讓法律資源更容易取得。">
  <title>Law Friend Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f6f2;
      color: #293e36;
      font-family: system-ui, -apple-system, "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      line-height: 1.8;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 72px 24px 40px;
      text-align: center;
    }

    header {
      padding: 24px 0 48px;
      border-bottom: 1px solid #dce2da;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -1px;
    }

    header p {
      margin: 8px 0;
      color: #627268;
    }

    .tagline {
      color: #293e36;
      font-size: 20px;
      font-weight: 500;
    }

    section {
      margin-top: 44px;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 24px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 112px;
      padding: 24px;
      border: 1px solid #dfe5dc;
      border-radius: 16px;
      background: #ffffff;
      color: #293e36;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: 500;
      transition: border-color .2s, box-shadow .2s;
    }

    .card:hover {
      border-color: #668573;
      box-shadow: 0 6px 18px rgb(41 62 54 / 8%);
    }

    .card:focus-visible {
      outline: 3px solid #668573;
      outline-offset: 4px;
    }

    /* 讓每一排的卡片整體置中 */
    .grid.one {
      grid-template-columns: minmax(0, 1fr);
      max-width: 306px;
      margin: 0 auto;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 628px;
      margin: 0 auto;
    }

    footer {
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid #dce2da;
    }

    footer h2 {
      font-size: 20px;
    }

    footer p {
      margin: 8px 0;
    }

    .notice {
      color: #627268;
      font-size: 14px;
    }

    @media (max-width: 720px) {
      main {
        padding: 32px 20px;
      }

      header {
        padding: 16px 0 32px;
      }

      .tagline {
        font-size: 18px;
      }

      .grid,
      .grid.one,
      .grid.two {
        grid-template-columns: 1fr;
        max-width: 420px;
        margin: 0 auto;
      }

      .card {
        min-height: 88px;
      }

      section {
        margin-top: 36px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1 lang="en">Law Friend Online</h1>
      <p class="tagline">這是一個提供免費法律相關模板的網站</p>
      <p>希望讓法律資源更容易取得</p>
    </header>

    <section aria-labelledby="contracts">
      <h2 id="contracts">合約模板</h2>

      <div class="grid">
        <a class="card" href="./brand-collaboration.pdf">
          品牌合作合約書
        </a>

        <a class="card" href="./promotion-agreement.pdf">
          委託推廣合約書
        </a>

        <a class="card" href="./license-agreement.pdf">
          授權合約
        </a>
      </div>
    </section>

    <section aria-labelledby="terms">
      <h2 id="terms">使用條款</h2>

      <div class="grid one">
        <a class="card" href="./terms-of-use.pdf">
          使用條款模板
        </a>
      </div>
    </section>

    <section aria-labelledby="shopping">
      <h2 id="shopping">購物須知</h2>

      <div class="grid two">
        <a class="card" href="./shopping-guide.pdf">
          購物須知模板
        </a>

        <a class="card" href="./purchase-agency.pdf">
          代購委託書
        </a>
      </div>
    </section>

    <footer>
      <h2>關於本專案</h2>
      <p>由 Victoria Chen 整理與維護。</p>
      <p class="notice">
        本站內容提供一般法律資訊，不構成個案法律意見。
      </p>
    </footer>
  </main>
</body>
</html>
